<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cobrinha Matemática</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="caderno" id="aplicativo">
    <!-- Cabeçalho com informações do jogo -->
    <header class="cabecalho">
      <div class="titulo-area">
        <h1>Cobrinha Matemática</h1>
        <button type="button" id="botao-tema" class="botao-icone" aria-label="Alternar tema claro ou escuro">
          🌓 Tema
        </button>
      </div>

      <div class="placar" aria-live="polite">
        <span id="texto-rodada">Rodada: 1/8</span>
        <span id="texto-pontos">Pontos: 0</span>
        <span id="texto-vidas" aria-label="Vidas restantes">❤️❤️❤️</span>
      </div>
    </header>

    <!-- Painel onde aparece a sequência numérica da rodada -->
    <section class="painel-desafio" aria-live="polite">
      <p class="instrucao-curta">Qual número completa a sequência?</p>
      <div id="sequencia-atual" class="sequencia-caixa">2, 4, 6, ?</div>
      <div id="mensagem-feedback" class="feedback" role="status">
        Use as setas do teclado ou os botões abaixo para guiar a cobrinha!
      </div>
    </section>

    <!-- Área principal do tabuleiro quadriculado -->
    <section class="area-jogo">
      <canvas id="tela-jogo" width="400" height="400" aria-label="Tabuleiro do jogo da cobrinha"></canvas>

      <!-- Tela sobreposta para início e fim de jogo -->
      <div id="tela-aviso" class="sobreposicao">
        <div class="cartao-aviso">
          <h2 id="titulo-aviso">Pronto para contar?</h2>
          <p id="descricao-aviso">
            Guie a cobrinha até o número que completa a sequência. Cuidado para não bater nas bordas ou no próprio corpo!
          </p>
          <button type="button" id="botao-iniciar" class="botao-principal">Começar Jogo</button>
        </div>
      </div>
    </section>

    <!-- Controles direcionais para celular e clique com o mouse -->
    <nav class="controles-mobile" aria-label="Controles de direção">
      <div class="linha-controle">
        <button type="button" class="botao-direcao" data-direcao="CIMA" aria-label="Mover para cima">▲</button>
      </div>
      <div class="linha-controle">
        <button type="button" class="botao-direcao" data-direcao="ESQUERDA" aria-label="Mover para esquerda">◀</button>
        <button type="button" class="botao-direcao" data-direcao="BAIXO" aria-label="Mover para baixo">▼</button>
        <button type="button" class="botao-direcao" data-direcao="DIREITA" aria-label="Mover para direita">▶</button>
      </div>
    </nav>
  </main>

  <script src="game.js"></script>
</body>
</html>
